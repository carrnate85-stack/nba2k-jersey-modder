<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA 2K Jersey Web Editor</title>
  <style>
    :root { color-scheme: dark; font-family: Segoe UI, Arial, sans-serif; }
    body { margin: 0; background: #171a20; color: #edf1f7; overflow: hidden; }
    header { height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #222833; border-bottom: 1px solid #343b49; }
    button { background: #f0b429; color: #171a20; border: 0; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .hint { color: #aab3c2; font-size: 13px; }
    #toolBar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1d222c; border-bottom: 1px solid #343b49; overflow-x: auto; overflow-y: hidden; white-space: nowrap; }
    #toolBar .divider { width: 1px; height: 26px; background: #3b4556; margin: 0 3px; }
    #toolBar .tool-label { color: #aab3c2; font-size: 12px; }
    #toolBar button.active { background: #168579; color: #fff; }
    #toolBar button { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; }
    #toolBar .tool-icon { width: 18px; height: 18px; flex: 0 0 18px; }
    #toolBar input { width: auto; }
    #toolBar input[type="color"] { width: 38px; height: 32px; padding: 2px; }
    #toolBar input[type="text"] { width: 82px; }
    #toolBar input[type="range"] { width: 120px; }
    #toolBar input[type="number"] { width: 64px; }
    #bucketControls { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    #wrap { height: calc(100vh - 97px); display: grid; grid-template-columns: 1fr 300px; }
    #stage { min-width: 0; min-height: 0; overflow: auto; background: #11141a; }
    canvas { background: #20242b; display: block; margin: 10px auto; }
    aside { border-left: 1px solid #343b49; padding: 12px; overflow: auto; background: #1d222c; }
    h2 { font-size: 14px; margin: 0 0 10px; color: #f8fafc; }
    .layer { padding: 8px; border: 1px solid #343b49; margin-bottom: 8px; border-radius: 6px; color: #d7deeb; cursor: pointer; }
    .layer.active { border-color: #f0b429; color: #fff; }
    .layer strong, .layer span { display: block; }
    .layer span { color: #99a5b8; font-size: 12px; margin-top: 3px; }
    .panel { border-top: 1px solid #343b49; margin-top: 12px; padding-top: 12px; }
    label { display: block; color: #aab3c2; font-size: 12px; margin: 8px 0 3px; }
    input { width: 100%; box-sizing: border-box; background: #11141a; color: #edf1f7; border: 1px solid #343b49; border-radius: 5px; padding: 7px; }
    input[type="checkbox"] { width: auto; }
    .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; color: #d7deeb; font-size: 13px; }
    .check input { margin: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .buttons { display: flex; gap: 8px; margin-top: 10px; }
    .buttons button { flex: 1; padding: 7px 8px; }
    button.secondary { background: #303746; color: #edf1f7; border: 1px solid #475064; }
    #returnToApp { margin-left: auto; background: #168579; color: white; }
    button:disabled { opacity: .45; cursor: default; }
    .small { color: #9aa4b5; font-size: 12px; line-height: 1.4; margin-top: 12px; }
    .uv-panel { border: 1px solid #343b49; border-radius: 6px; padding: 10px; margin-bottom: 12px; background: #202632; }
    .uv-panel h2 { margin-bottom: 6px; }
    .range-row { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { padding: 0; }
    .aspect-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 8px 10px; border: 1px solid #3b4556; border-radius: 6px; background: #202632; }
    .aspect-row.hidden { display: none; }
    .aspect-row .check { margin: 0; }
    .lock-state { color: #f0b429; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <strong>Jersey Web Editor</strong>
    <button id="refresh">Refresh from app</button>
    <button id="resetEditor" class="secondary">Reset edits</button>
    <button id="viewTexture">Texture</button>
    <button id="viewRegion" class="secondary">Region</button>
    <button id="editorZoomOut" class="secondary">Zoom -</button>
    <button id="editorFit" class="secondary">Fit</button>
    <button id="editorZoomIn" class="secondary">Zoom +</button>
    <span id="editorZoomLabel" class="hint">100%</span>
    <span id="loadStatus" class="hint"></span>
    <span class="hint">Scroll to zoom. Hold the scroll wheel and drag to pan.</span>
    <button id="returnToApp">Return to App</button>
  </header>
  <div id="toolBar">
    <button id="toolSelect" class="active" title="Select and move layers">Select / Move</button>
    <button id="toolBucket" class="secondary" title="Fill a connected color area">
      <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"></path>
        <path d="m5 2 5 5"></path>
        <path d="M2 13h15"></path>
        <path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"></path>
      </svg>
      <span>Paint Bucket</span>
    </button>
    <button id="toolSampler" class="secondary" title="Sample a color from the texture">
      <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"></path>
        <path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"></path>
        <path d="m2 22 .414-.414"></path>
      </svg>
      <span>Color Sampler</span>
    </button>
    <span class="divider"></span>
    <div id="bucketControls">
      <span class="tool-label">Fill</span>
      <input id="paintColor" type="color" value="#ffffff" aria-label="Paint color">
      <input id="paintHex" type="text" value="#ffffff" maxlength="7" aria-label="Paint color hex code">
      <span class="tool-label">Tolerance</span>
      <input id="paintTolerance" type="range" min="0" max="255" value="24" aria-label="Paint tolerance">
      <input id="paintToleranceNumber" type="number" min="0" max="255" value="24" aria-label="Paint tolerance value">
      <button id="undoPaint" class="secondary" disabled>Undo Fill</button>
    </div>
  </div>
  <div id="wrap">
    <main id="stage"><canvas id="canvas" width="2048" height="2048"></canvas></main>
    <aside>
      <div id="uvPanel" class="uv-panel">
        <h2>UV Overlay</h2>
        <label class="check"><input id="showUvOverlay" type="checkbox"> Show UV overlay</label>
        <label for="uvColor">Line color</label>
        <select id="uvColor"><option value="black">Black</option><option value="white">White</option></select>
        <label for="uvOpacity">Opacity <span id="uvOpacityLabel">45%</span></label>
        <input id="uvOpacity" type="range" min="0" max="100" step="1" value="45">
      </div>
      <h2>Editable Images</h2>
      <div id="layers"></div>
      <div class="panel">
        <h2>Position / Layer</h2>
        <div id="selectedName" class="small">Select an image.</div>
        <div class="grid">
          <div><label for="posX">X</label><input id="posX" type="number" step="1"></div>
          <div><label for="posY">Y</label><input id="posY" type="number" step="1"></div>
          <div><label for="posW">Width</label><input id="posW" type="number" step="1" min="1"></div>
          <div><label for="posH">Height</label><input id="posH" type="number" step="1" min="1"></div>
          <div><label for="rotation">Rotation</label><input id="rotation" type="number" step="1"></div>
        </div>
        <div id="aspectLockRow" class="aspect-row hidden">
          <label class="check"><input id="lockAspect" type="checkbox" checked> Lock proportions</label>
          <span id="lockAspectState" class="lock-state">Locked</span>
        </div>
        <div class="buttons"><button id="applyPosition">Apply</button></div>
        <div class="buttons">
          <button id="layerUp" class="secondary">Layer Up</button>
          <button id="layerDown" class="secondary">Layer Down</button>
        </div>
        <div class="buttons"><button id="flipX" class="secondary">Flip X</button></div>
      </div>
      <div class="panel">
        <h2>Transparency</h2>
        <label class="check"><input id="autoBackground" type="checkbox"> Auto background</label>
        <label class="check"><input id="removeWhite" type="checkbox"> Remove white</label>
        <label class="check"><input id="removeBlack" type="checkbox"> Remove black</label>
        <label class="check"><input id="outsideOnly" type="checkbox"> Outside only</label>
        <label for="cleanupTolerance">Tolerance</label>
        <input id="cleanupTolerance" type="number" min="0" max="255" step="1">
        <div class="buttons">
          <button id="applyTransparency">Apply</button>
          <button id="resetTransparency" class="secondary">Use Default</button>
        </div>
      </div>
      <div class="small">Changes are sent back to the desktop app when you release the mouse. Use the desktop app to export PNG or PSD.</div>
    </aside>
  </div>
  <script>
function escapeHtml(value) { const node = document.createElement("span"); node.textContent = String(value ?? ""); return node.innerHTML; }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");
    const layers = document.getElementById("layers");
    const selectedName = document.getElementById("selectedName");
    const posX = document.getElementById("posX");
    const posY = document.getElementById("posY");
    const posW = document.getElementById("posW");
    const posH = document.getElementById("posH");
    const rotation = document.getElementById("rotation");
    const aspectLockRow = document.getElementById("aspectLockRow");
    const lockAspect = document.getElementById("lockAspect");
    const lockAspectState = document.getElementById("lockAspectState");
    const applyPosition = document.getElementById("applyPosition");
    const layerUp = document.getElementById("layerUp");
    const layerDown = document.getElementById("layerDown");
    const flipX = document.getElementById("flipX");
    const autoBackground = document.getElementById("autoBackground");
    const removeWhite = document.getElementById("removeWhite");
    const removeBlack = document.getElementById("removeBlack");
    const outsideOnly = document.getElementById("outsideOnly");
    const cleanupTolerance = document.getElementById("cleanupTolerance");
    const applyTransparency = document.getElementById("applyTransparency");
    const resetTransparency = document.getElementById("resetTransparency");
    const resetEditor = document.getElementById("resetEditor");
    const viewTexture = document.getElementById("viewTexture");
    const viewRegion = document.getElementById("viewRegion");
    const editorZoomLabel = document.getElementById("editorZoomLabel");
    const loadStatus = document.getElementById("loadStatus");
    const returnToApp = document.getElementById("returnToApp");
    const uvPanel = document.getElementById("uvPanel");
    const showUvOverlay = document.getElementById("showUvOverlay");
    const uvColor = document.getElementById("uvColor");
    const uvOpacity = document.getElementById("uvOpacity");
    const uvOpacityLabel = document.getElementById("uvOpacityLabel");
    const toolSelect = document.getElementById("toolSelect");
    const toolBucket = document.getElementById("toolBucket");
    const toolSampler = document.getElementById("toolSampler");
    const bucketControls = document.getElementById("bucketControls");
    const paintColor = document.getElementById("paintColor");
    const paintHex = document.getElementById("paintHex");
    const paintTolerance = document.getElementById("paintTolerance");
    const paintToleranceNumber = document.getElementById("paintToleranceNumber");
    const undoPaint = document.getElementById("undoPaint");
    let editorZoom = 1;
    let viewMode = "texture";
    let project = null;
    let baseImage = new Image();
    let regionImage = new Image();
    let uvImage = new Image();
    let uvOverlayAvailable = false;
    let uvOverlayEnabled = false;
    let uvOverlayOpacity = 45;
    let uvOverlayColor = "black";
    let uvOverlayTouched = false;
    let overlays = new Map();
    let activeKey = null;
    let drag = null;
    let pan = null;
    let nudgeTimer = null;
    let lastSizeField = "width";
    let activeTool = "select";
    let paintBusy = false;
    let lastPaintTarget = null;
    const PAINT_BUCKET_CURSOR = `url("data:image/svg+xml,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#168579" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/>
        <path d="m5 2 5 5"/>
        <path d="M2 13h15"/>
        <path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/>
      </svg>
    `)}") 3 17, crosshair`;
    const PIPETTE_CURSOR = `url("data:image/svg+xml,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"/>
        <path d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"/>
        <path d="m2 22 .414-.414"/>
      </svg>
    `)}") 3 29, crosshair`;
    const HANDLE_SIZE = 56;
    const HANDLE_HIT_RADIUS = 58;
    const ALPHA_HIT_THRESHOLD = 12;
    const hitCanvas = document.createElement("canvas");
    hitCanvas.width = 1;
    hitCanvas.height = 1;
    const hitContext = hitCanvas.getContext("2d", {willReadFrequently: true});

    function cacheBustedUrl(url) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}t=${Date.now()}`;
    }

    function loadImage(url) {
      return new Promise(resolve => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => resolve(null);
        image.src = cacheBustedUrl(url);
      });
    }

    async function loadProject() {
      try {
        loadStatus.textContent = "Loading...";
        const response = await fetch("/api/project", {cache: "no-store"});
        if (!response.ok) throw new Error(`Project failed: ${response.status}`);
        project = await response.json();
        overlays.clear();
        const [loadedBase, loadedRegion] = await Promise.all([loadImage(project.baseUrl), loadImage("/api/region.png")]);
        baseImage = loadedBase || new Image();
        regionImage = loadedRegion || new Image();
        uvOverlayAvailable = Boolean(project.uvOverlay?.available);
        if (uvOverlayAvailable) {
          if (!uvOverlayTouched) {
            uvOverlayEnabled = Boolean(project.uvOverlay?.enabled);
            uvOverlayOpacity = Math.max(0, Math.min(100, Number(project.uvOverlay?.opacity ?? uvOverlayOpacity)));
            uvOverlayColor = project.uvOverlay?.color === "white" ? "white" : "black";
          }
          uvImage = await loadImage(project.uvOverlay.imageUrl) || new Image();
        }
        renderUvControls();
        draw();
        const failedLayers = [];
        for (let index = 0; index < project.overlays.length; index += 1) {
          const item = project.overlays[index];
          loadStatus.textContent = `Loading image ${index + 1} of ${project.overlays.length}...`;
          const image = await loadImage(item.imageUrl);
          if (image) {
            overlays.set(item.key, image);
            draw();
          } else {
            failedLayers.push(item.label);
          }
        }
        if (!project.overlays.some(item => item.key === activeKey)) {
          activeKey = project.overlays[project.overlays.length - 1]?.key || null;
        }
        renderLayerList();
        renderInspector();
        draw();
        loadStatus.textContent = failedLayers.length
          ? `Could not load: ${failedLayers.join(", ")}`
          : `Loaded ${project.overlays.length} image${project.overlays.length === 1 ? "" : "s"}`;
      } catch (error) {
        loadStatus.textContent = `Could not load editor: ${error.message}`;
      }
    }

    function renderLayerList() {
      layers.innerHTML = "";
      if (viewMode === "region") {
        const node = document.createElement("div");
        node.className = "layer";
        node.innerHTML = "<strong>Region Preview</strong><span>Side panels, logos, and wordmark regions</span>";
        layers.appendChild(node);
        return;
      }
      for (const item of [...project.overlays].reverse()) {
        const node = document.createElement("div");
        node.className = "layer" + (item.key === activeKey ? " active" : "");
        const lockLabel = item.canLockAspect
          ? ` - proportions ${item.lockAspect === false ? "unlocked" : "locked"}`
          : "";
        node.innerHTML = `<strong>${escapeHtml(item.label)}</strong><span>${escapeHtml(item.layerLabel)}${lockLabel}</span>`;
        node.onclick = () => {
          activeKey = item.key;
          renderLayerList();
          renderInspector();
          draw();
        };
        layers.appendChild(node);
      }
    }

    function activeItem() {
      if (viewMode === "region") return null;
      return project?.overlays.find(item => item.key === activeKey) || null;
    }

    function renderInspector() {
      const item = activeItem();
      const disabled = !item;
      const canUndoSelected = Boolean(item?.canPaint && item.canUndoPaint);
      const canUndoBase = lastPaintTarget === "base_colors" && Boolean(project?.canUndoBasePaint);
      undoPaint.disabled = activeTool !== "bucket" || paintBusy || (!canUndoSelected && !canUndoBase);
      for (const input of [posX, posY, posW, posH]) input.disabled = disabled || !item.canTransform;
      rotation.disabled = disabled || !item.canRotate;
      applyPosition.disabled = disabled || !item.canTransform;
      layerUp.disabled = disabled || !item.canReorder;
      layerDown.disabled = disabled || !item.canReorder;
      flipX.disabled = disabled || !item.canFlip;
      for (const input of [autoBackground, removeWhite, removeBlack, outsideOnly, cleanupTolerance]) {
        input.disabled = disabled || !item.canCleanup;
      }
      applyTransparency.disabled = disabled || !item.canCleanup;
      resetTransparency.disabled = disabled || !item.canCleanup || !item.cleanup?.isOverride;
      aspectLockRow.classList.toggle("hidden", disabled || !item.canLockAspect);
      if (!item) {
        selectedName.textContent = viewMode === "region"
          ? "Region preview only."
          : "Select an image.";
        for (const input of [posX, posY, posW, posH]) input.value = "";
        rotation.value = "";
        autoBackground.checked = false;
        removeWhite.checked = false;
        removeBlack.checked = false;
        outsideOnly.checked = true;
        cleanupTolerance.value = "";
        lockAspect.checked = true;
        lockAspectState.textContent = "Locked";
        return;
      }
      selectedName.textContent = `${escapeHtml(item.label)} - ${escapeHtml(item.layerLabel)}${item.flipX ? " - flipped" : ""}`;
      posX.value = Math.round(item.x);
      posY.value = Math.round(item.y);
      posW.value = Math.round(item.width);
      posH.value = Math.round(item.height);
      rotation.value = Math.round(item.rotation || 0);
      posX.disabled = !item.canTransform || item.lockX;
      posW.disabled = !item.canTransform || item.lockWidth;
      lockAspect.checked = item.lockAspect !== false;
      lockAspectState.textContent = lockAspect.checked ? "Locked" : "Unlocked";
      autoBackground.checked = Boolean(item.cleanup?.autoBackground);
      removeWhite.checked = Boolean(item.cleanup?.removeWhite);
      removeBlack.checked = Boolean(item.cleanup?.removeBlack);
      outsideOnly.checked = item.cleanup?.outsideOnly !== false;
      cleanupTolerance.value = Math.round(item.cleanup?.tolerance ?? 32);
    }

    function fittedCanvasSize() {
      const size = Math.max(320, Math.min(stage.clientWidth - 20, stage.clientHeight - 20));
      return size;
    }

    function applyCanvasZoom() {
      const displaySize = Math.max(320, Math.round(fittedCanvasSize() * editorZoom));
      canvas.style.width = displaySize + "px";
      canvas.style.height = displaySize + "px";
      editorZoomLabel.textContent = `${Math.round(editorZoom * 100)}%`;
    }

    function draw() {
      applyCanvasZoom();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (viewMode === "region") {
        if (regionImage.complete) ctx.drawImage(regionImage, 0, 0, 2048, 2048);
        renderInspector();
        return;
      }
      if (baseImage.complete) ctx.drawImage(baseImage, 0, 0, 2048, 2048);
      for (const item of project?.overlays || []) {
        const img = overlays.get(item.key);
        if (!img?.complete) continue;
        ctx.save();
        ctx.globalCompositeOperation = canvasBlendMode(item.blendMode);
        if (item.clipBox) {
          ctx.beginPath();
          ctx.rect(item.clipBox.x, item.clipBox.y, item.clipBox.width, item.clipBox.height);
          ctx.clip();
        }
        if (item.excludeBoxes?.length) {
          ctx.beginPath();
          ctx.rect(0, 0, 2048, 2048);
          for (const box of item.excludeBoxes) {
            ctx.rect(box.x, box.y, box.width, box.height);
          }
          ctx.clip("evenodd");
        }
        drawOverlayImage(img, item);
        ctx.restore();
      }
      drawUvOverlay();
      const active = project?.overlays.find(item => item.key === activeKey);
      if (activeTool === "select" && active?.canTransform) drawBox(active);
      renderInspector();
    }

    function renderUvControls() {
      uvPanel.style.display = uvOverlayAvailable ? "block" : "none";
      showUvOverlay.checked = uvOverlayEnabled;
      showUvOverlay.disabled = !uvOverlayAvailable;
      uvOpacity.disabled = !uvOverlayAvailable || !uvOverlayEnabled;
      uvColor.disabled = !uvOverlayAvailable || !uvOverlayEnabled;
      uvColor.value = uvOverlayColor;
      uvOpacity.value = uvOverlayOpacity;
      uvOpacityLabel.textContent = `${Math.round(uvOverlayOpacity)}%`;
    }

    function drawUvOverlay() {
      if (!uvOverlayAvailable || !uvOverlayEnabled || viewMode !== "texture") return;
      if (!uvImage.complete || !uvImage.naturalWidth) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, uvOverlayOpacity / 100));
      ctx.filter = uvOverlayColor === "white" ? "invert(1)" : "none";
      ctx.drawImage(uvImage, 0, 0, 2048, 2048);
      ctx.restore();
    }

    function setViewMode(nextMode) {
      viewMode = nextMode;
      if (viewMode === "region") setTool("select");
      viewTexture.classList.toggle("secondary", viewMode !== "texture");
      viewRegion.classList.toggle("secondary", viewMode !== "region");
      renderLayerList();
      renderInspector();
      draw();
      if (viewMode === "region") refreshRegionPreview();
    }

    function canvasBlendMode(blendMode) {
      if (blendMode === "multiply") return "multiply";
      if (blendMode === "overlay") return "overlay";
      return "source-over";
    }

    function drawOverlayImage(img, item) {
      const angle = (item.rotation || 0) * Math.PI / 180;
      if (!angle) {
        ctx.drawImage(img, item.x, item.y, item.width, item.height);
        return;
      }
      const cx = item.x + item.width / 2;
      const cy = item.y + item.height / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.drawImage(img, -item.width / 2, -item.height / 2, item.width, item.height);
      ctx.restore();
    }

    function drawBox(item) {
      ctx.save();
      ctx.strokeStyle = "#ffcc33";
      ctx.lineWidth = 5;
      const angle = (item.rotation || 0) * Math.PI / 180;
      const cx = item.x + item.width / 2;
      const cy = item.y + item.height / 2;
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.strokeRect(-item.width / 2, -item.height / 2, item.width, item.height);
      const guideBox = item.clipBox || item.guideBox;
      if (guideBox) {
        ctx.restore();
        ctx.save();
        ctx.setLineDash([16, 10]);
        ctx.strokeStyle = "#31d0ff";
        ctx.strokeRect(guideBox.x, guideBox.y, guideBox.width, guideBox.height);
        ctx.setLineDash([]);
        ctx.translate(cx, cy);
        ctx.rotate(angle);
      }
      ctx.fillStyle = "#ffcc33";
      for (const handle of localHandles(item)) {
        ctx.fillRect(handle.x - HANDLE_SIZE / 2, handle.y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
      }
      ctx.restore();
    }

    function localHandles(item) {
      if (item.lockWidth) return [{x: item.width / 2, y: item.height / 2, sx: 0, sy: 1}];
      return [
        {x: -item.width / 2, y: -item.height / 2, sx: -1, sy: -1},
        {x: item.width / 2, y: -item.height / 2, sx: 1, sy: -1},
        {x: -item.width / 2, y: item.height / 2, sx: -1, sy: 1},
        {x: item.width / 2, y: item.height / 2, sx: 1, sy: 1},
      ];
    }

    function rotatedPoint(item, localX, localY) {
      const angle = (item.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const cx = item.x + item.width / 2;
      const cy = item.y + item.height / 2;
      return {
        x: cx + localX * cos - localY * sin,
        y: cy + localX * sin + localY * cos,
      };
    }

    function localPoint(point, item) {
      const angle = (item.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const cx = item.x + item.width / 2;
      const cy = item.y + item.height / 2;
      const dx = point.x - cx;
      const dy = point.y - cy;
      return {
        x: dx * cos + dy * sin,
        y: -dx * sin + dy * cos,
      };
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) * 2048 / rect.width,
        y: (event.clientY - rect.top) * 2048 / rect.height,
      };
    }

    function pointInsideBox(point, box) {
      return point.x >= box.x && point.x <= box.x + box.width &&
             point.y >= box.y && point.y <= box.y + box.height;
    }

    function visiblePixelHit(point, item, local) {
      if (item.clipBox && !pointInsideBox(point, item.clipBox)) return false;
      if (item.excludeBoxes?.some(box => pointInsideBox(point, box))) return false;
      const image = overlays.get(item.key);
      if (!image?.complete || !image.naturalWidth || !image.naturalHeight) return true;
      const normalizedX = (local.x + item.width / 2) / Math.max(1, item.width);
      const normalizedY = (local.y + item.height / 2) / Math.max(1, item.height);
      if (normalizedX < 0 || normalizedX > 1 || normalizedY < 0 || normalizedY > 1) {
        return false;
      }
      const sourceX = Math.max(
        0,
        Math.min(image.naturalWidth - 1, Math.floor(normalizedX * image.naturalWidth)),
      );
      const sourceY = Math.max(
        0,
        Math.min(image.naturalHeight - 1, Math.floor(normalizedY * image.naturalHeight)),
      );
      try {
        hitContext.clearRect(0, 0, 1, 1);
        hitContext.drawImage(image, sourceX, sourceY, 1, 1, 0, 0, 1, 1);
        return hitContext.getImageData(0, 0, 1, 1).data[3] >= ALPHA_HIT_THRESHOLD;
      } catch (_) {
        return true;
      }
    }

    function hitTest(point) {
      for (const item of [...project.overlays].reverse()) {
        if (!item.canTransform) continue;
        for (const handle of localHandles(item)) {
          const handlePoint = rotatedPoint(item, handle.x, handle.y);
          if (distance(point, handlePoint) <= HANDLE_HIT_RADIUS) {
            return {item, mode: "resize", handle};
          }
        }
        const local = localPoint(point, item);
        const inBody = local.x >= -item.width / 2 && local.x <= item.width / 2 &&
                       local.y >= -item.height / 2 && local.y <= item.height / 2;
        if (inBody && visiblePixelHit(point, item, local)) {
          return {item, mode: "move"};
        }
      }
      return null;
    }

    function paintHitTest(point) {
      const candidates = [...(project?.overlays || [])].reverse();
      const selected = activeItem();
      if (selected?.canPaint) {
        const selectedIndex = candidates.findIndex(item => item.key === selected.key);
        if (selectedIndex >= 0) {
          candidates.splice(selectedIndex, 1);
          candidates.unshift(selected);
        }
      }
      for (const item of candidates) {
        if (!item.canPaint) continue;
        const local = localPoint(point, item);
        const inBody = local.x >= -item.width / 2 && local.x <= item.width / 2 &&
                       local.y >= -item.height / 2 && local.y <= item.height / 2;
        if (!inBody || !visiblePixelHit(point, item, local)) continue;
        return {
          item,
          x: Math.max(0, Math.min(1, (local.x + item.width / 2) / Math.max(1, item.width))),
          y: Math.max(0, Math.min(1, (local.y + item.height / 2) / Math.max(1, item.height))),
        };
      }
      return null;
    }

    function setTool(tool) {
      activeTool = ["bucket", "sampler"].includes(tool) ? tool : "select";
      drag = null;
      toolSelect.classList.toggle("active", activeTool === "select");
      toolSelect.classList.toggle("secondary", activeTool !== "select");
      toolBucket.classList.toggle("active", activeTool === "bucket");
      toolBucket.classList.toggle("secondary", activeTool !== "bucket");
      toolSampler.classList.toggle("active", activeTool === "sampler");
      toolSampler.classList.toggle("secondary", activeTool !== "sampler");
      const bucketEnabled = activeTool === "bucket";
      const colorEnabled = bucketEnabled || activeTool === "sampler";
      bucketControls.style.opacity = colorEnabled ? "1" : ".55";
      paintColor.disabled = !colorEnabled || paintBusy;
      paintHex.disabled = !colorEnabled || paintBusy;
      paintTolerance.disabled = !bucketEnabled || paintBusy;
      paintToleranceNumber.disabled = !bucketEnabled || paintBusy;
      canvas.style.cursor = activeCanvasCursor();
      renderInspector();
      draw();
    }

    function activeCanvasCursor() {
      if (activeTool === "bucket") return PAINT_BUCKET_CURSOR;
      if (activeTool === "sampler") return PIPETTE_CURSOR;
      return "default";
    }

    function sampleAt(point) {
      const previousUvState = uvOverlayEnabled;
      uvOverlayEnabled = false;
      draw();
      const pixel = ctx.getImageData(
        Math.max(0, Math.min(2047, Math.floor(point.x))),
        Math.max(0, Math.min(2047, Math.floor(point.y))),
        1,
        1,
      ).data;
      uvOverlayEnabled = previousUvState;
      draw();
      if (pixel[3] < 8) {
        loadStatus.textContent = "That point is transparent. Sample inside the texture.";
        return;
      }
      const value = `#${[pixel[0], pixel[1], pixel[2]]
        .map(channel => channel.toString(16).padStart(2, "0"))
        .join("")}`;
      paintColor.value = value;
      paintHex.value = value;
      loadStatus.textContent = `Sampled ${value}`;
    }

    async function paintAt(point) {
      if (paintBusy || viewMode !== "texture") return;
      const hit = paintHitTest(point);
      const paintKey = hit?.item.key || "base_colors";
      const paintLabel = hit?.item.label || "template color area";
      activeKey = hit?.item.key || null;
      paintBusy = true;
      renderLayerList();
      setTool("bucket");
      loadStatus.textContent = `Filling ${paintLabel}...`;
      try {
        const response = await fetch("/api/paint", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            key: paintKey,
            x: hit?.x ?? point.x / 2048,
            y: hit?.y ?? point.y / 2048,
            color: paintColor.value,
            tolerance: Number(paintTolerance.value || 0),
          }),
        });
        if (!response.ok) throw new Error(`Paint failed: ${response.status}`);
        const result = await response.json();
        if (result.changed) lastPaintTarget = paintKey;
        await loadProject();
        loadStatus.textContent = result.changed
          ? `Filled ${result.label || paintLabel}`
          : (result.message || "No pixels changed.");
      } catch (error) {
        loadStatus.textContent = error.message;
      } finally {
        paintBusy = false;
        setTool("bucket");
      }
    }

    canvas.addEventListener("pointerdown", event => {
      if (event.button === 1) {
        event.preventDefault();
        pan = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          scrollLeft: stage.scrollLeft,
          scrollTop: stage.scrollTop,
        };
        canvas.setPointerCapture(event.pointerId);
        canvas.style.cursor = "grabbing";
        return;
      }
      if (event.button !== 0) return;
      if (viewMode === "region") return;
      const point = canvasPoint(event);
      if (activeTool === "bucket") {
        event.preventDefault();
        paintAt(point);
        return;
      }
      if (activeTool === "sampler") {
        event.preventDefault();
        sampleAt(point);
        return;
      }
      const hit = hitTest(point);
      if (!hit) {
        activeKey = null;
        renderLayerList();
        renderInspector();
        draw();
        return;
      }
      activeKey = hit.item.key;
      renderLayerList();
      renderInspector();
      drag = {
        mode: hit.mode,
        key: hit.item.key,
        start: point,
        original: {...hit.item},
        handle: hit.handle,
      };
      canvas.setPointerCapture(event.pointerId);
      draw();
    });

    async function sendUpdate(item) {
      const response = await fetch("/api/update", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          key: item.key,
          x: item.x,
          y: item.y,
          width: item.width,
          height: item.height,
          rotation: item.rotation || 0,
          lockAspect: item.lockAspect !== false,
        }),
      });
      if (!response.ok) throw new Error(`Save failed: ${response.status}`);
      const result = await response.json();
      if (result.overlay) Object.assign(item, result.overlay);
      loadStatus.textContent = `Saved ${escapeHtml(item.label)}`;
    }

    async function refreshRegionPreview() {
      regionImage = await loadImage("/api/region.png") || regionImage;
      if (viewMode === "region") draw();
    }

    function queueNudgeUpdate(item) {
      if (nudgeTimer) clearTimeout(nudgeTimer);
      const update = {...item};
      nudgeTimer = setTimeout(async () => {
        nudgeTimer = null;
        await sendUpdate(update);
      }, 160);
    }

    document.addEventListener("keydown", event => {
      if (!event.key.startsWith("Arrow") || viewMode === "region" || activeTool !== "select") return;
      const activeElement = document.activeElement;
      if (activeElement && ["INPUT", "SELECT", "TEXTAREA"].includes(activeElement.tagName)) {
        return;
      }
      const item = activeItem();
      if (!item?.canTransform) return;
      const amount = event.shiftKey ? 10 : 1;
      let deltaX = 0;
      let deltaY = 0;
      if (event.key === "ArrowLeft") deltaX = -amount;
      if (event.key === "ArrowRight") deltaX = amount;
      if (event.key === "ArrowUp") deltaY = -amount;
      if (event.key === "ArrowDown") deltaY = amount;
      if (item.lockX) deltaX = 0;
      if (!deltaX && !deltaY) return;
      event.preventDefault();
      item.x += deltaX;
      item.y += deltaY;
      draw();
      queueNudgeUpdate(item);
    });

    canvas.addEventListener("pointermove", event => {
      if (pan) {
        stage.scrollLeft = pan.scrollLeft - (event.clientX - pan.startX);
        stage.scrollTop = pan.scrollTop - (event.clientY - pan.startY);
        return;
      }
      if (viewMode === "region" || activeTool !== "select") return;
      if (!drag) return;
      const point = canvasPoint(event);
      const item = project.overlays.find(candidate => candidate.key === drag.key);
      const dx = point.x - drag.start.x;
      const dy = point.y - drag.start.y;
      if (drag.mode === "move") {
        if (item.lockX) {
          item.x = drag.original.x;
          item.y = drag.original.y + dy;
        } else {
          item.x = drag.original.x + dx;
          item.y = drag.original.y + dy;
        }
      } else {
        if (item.lockWidth) {
          item.x = drag.original.x;
          item.width = drag.original.width;
          item.height = Math.max(1, drag.original.height + dy);
        } else {
          const handle = drag.handle || {sx: 1, sy: 1};
          const currentLocal = localPoint(point, drag.original);
          const opposite = {
            x: -handle.sx * drag.original.width / 2,
            y: -handle.sy * drag.original.height / 2,
          };
          const widthFromX = Math.max(1, (currentLocal.x - opposite.x) * handle.sx);
          const heightFromY = Math.max(1, (currentLocal.y - opposite.y) * handle.sy);
          if (item.lockAspect === false) {
            item.width = widthFromX;
            item.height = heightFromY;
          } else {
            const widthScale = widthFromX / Math.max(1, drag.original.width);
            const heightScale = heightFromY / Math.max(1, drag.original.height);
            const scale = Math.abs(widthScale - 1) >= Math.abs(heightScale - 1)
              ? widthScale
              : heightScale;
            item.width = Math.max(1, drag.original.width * scale);
            item.height = Math.max(1, drag.original.height * scale);
          }
          const active = {
            x: opposite.x + handle.sx * item.width,
            y: opposite.y + handle.sy * item.height,
          };
          const centerLocal = {
            x: (opposite.x + active.x) / 2,
            y: (opposite.y + active.y) / 2,
          };
          const centerWorld = rotatedPoint(drag.original, centerLocal.x, centerLocal.y);
          item.x = centerWorld.x - item.width / 2;
          item.y = centerWorld.y - item.height / 2;
          if (item.lockX) item.x = drag.original.x;
        }
      }
      draw();
    });

    canvas.addEventListener("pointerup", async event => {
      if (pan && pan.pointerId === event.pointerId) {
        pan = null;
        canvas.style.cursor = activeCanvasCursor();
        return;
      }
      if (viewMode === "region" || activeTool !== "select") return;
      if (!drag) return;
      const item = project.overlays.find(candidate => candidate.key === drag.key);
      drag = null;
      await sendUpdate(item);
      renderInspector();
      draw();
    });

    canvas.addEventListener("pointercancel", event => {
      if (pan && pan.pointerId === event.pointerId) {
        pan = null;
        canvas.style.cursor = activeCanvasCursor();
      }
    });

    canvas.addEventListener("auxclick", event => {
      if (event.button === 1) event.preventDefault();
    });

    applyPosition.onclick = async () => {
      const item = activeItem();
      if (!item) return;
      if (!item.lockX) item.x = Number(posX.value || 0);
      let requestedWidth = Math.max(1, Number(posW.value || 1));
      let requestedHeight = Math.max(1, Number(posH.value || 1));
      if (item.canLockAspect && item.lockAspect !== false) {
        const ratio = item.height / Math.max(1, item.width);
        if (lastSizeField === "height") requestedWidth = Math.max(1, requestedHeight / ratio);
        else requestedHeight = Math.max(1, requestedWidth * ratio);
      }
      if (!item.lockWidth) item.width = requestedWidth;
      item.y = Number(posY.value || 0);
      item.height = requestedHeight;
      item.rotation = Number(rotation.value || 0);
      await sendUpdate(item);
      renderInspector();
      draw();
    };

    function syncLockedSize(source) {
      const item = activeItem();
      lastSizeField = source;
      if (!item?.canLockAspect || item.lockAspect === false) return;
      const ratio = item.height / Math.max(1, item.width);
      if (source === "width") {
        posH.value = String(Math.max(1, Math.round(Number(posW.value || 1) * ratio)));
      } else {
        posW.value = String(Math.max(1, Math.round(Number(posH.value || 1) / ratio)));
      }
    }

    posW.addEventListener("input", () => syncLockedSize("width"));
    posH.addEventListener("input", () => syncLockedSize("height"));

    lockAspect.onchange = async () => {
      const item = activeItem();
      if (!item?.canLockAspect) return;
      item.lockAspect = lockAspect.checked;
      lockAspectState.textContent = lockAspect.checked ? "Locked" : "Unlocked";
      renderLayerList();
      await sendUpdate(item);
      draw();
    };

    async function reorder(direction) {
      const item = activeItem();
      if (!item || !item.canReorder) return;
      await fetch("/api/reorder", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key: item.key, direction}),
      });
      await loadProject();
    }

    async function sendTransparency(clearOverride = false) {
      const item = activeItem();
      if (!item || !item.canCleanup) return;
      await fetch("/api/transparency", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          key: item.key,
          autoBackground: autoBackground.checked,
          removeWhite: removeWhite.checked,
          removeBlack: removeBlack.checked,
          outsideOnly: outsideOnly.checked,
          tolerance: Number(cleanupTolerance.value || 32),
          clearOverride,
        }),
      });
      await loadProject();
    }

    async function flipSelected() {
      const item = activeItem();
      if (!item || !item.canFlip) return;
      await fetch("/api/flip", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key: item.key}),
      });
      await loadProject();
    }

    layerUp.onclick = () => reorder("up");
    layerDown.onclick = () => reorder("down");
    flipX.onclick = flipSelected;
    applyTransparency.onclick = () => sendTransparency(false);
    resetTransparency.onclick = () => sendTransparency(true);
    toolSelect.onclick = () => setTool("select");
    toolBucket.onclick = () => setTool("bucket");
    toolSampler.onclick = () => setTool("sampler");
    paintColor.oninput = () => {
      paintHex.value = paintColor.value;
    };
    paintHex.onchange = () => {
      const value = paintHex.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(value)) {
        paintColor.value = value;
        paintHex.value = value.toLowerCase();
      } else {
        paintHex.value = paintColor.value;
      }
    };
    function setPaintTolerance(value) {
      const clamped = Math.max(0, Math.min(255, Math.round(Number(value) || 0)));
      paintTolerance.value = String(clamped);
      paintToleranceNumber.value = String(clamped);
    }
    paintTolerance.oninput = () => setPaintTolerance(paintTolerance.value);
    paintToleranceNumber.oninput = () => setPaintTolerance(paintToleranceNumber.value);
    undoPaint.onclick = async () => {
      const item = activeItem();
      const paintKey = item?.canPaint && item.canUndoPaint ? item.key : lastPaintTarget;
      if (!paintKey || paintBusy) return;
      const paintLabel = item?.label || "template color area";
      paintBusy = true;
      setTool("bucket");
      loadStatus.textContent = `Undoing fill on ${paintLabel}...`;
      try {
        const response = await fetch("/api/paint/undo", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({key: paintKey}),
        });
        if (!response.ok) throw new Error(`Undo failed: ${response.status}`);
        const result = await response.json();
        await loadProject();
        if (paintKey === "base_colors" && !project?.canUndoBasePaint) lastPaintTarget = null;
        loadStatus.textContent = result.ok
          ? `Undid fill on ${paintLabel}`
          : (result.message || "No fill is available to undo.");
      } catch (error) {
        loadStatus.textContent = error.message;
      } finally {
        paintBusy = false;
        setTool("bucket");
      }
    };
    showUvOverlay.onchange = () => {
      uvOverlayTouched = true;
      uvOverlayEnabled = showUvOverlay.checked;
      renderUvControls();
      draw();
    };
    uvOpacity.oninput = () => {
      uvOverlayTouched = true;
      uvOverlayOpacity = Number(uvOpacity.value || 0);
      uvOpacityLabel.textContent = `${Math.round(uvOverlayOpacity)}%`;
      draw();
    };
    uvColor.onchange = () => {
      uvOverlayTouched = true;
      uvOverlayColor = uvColor.value === "white" ? "white" : "black";
      draw();
    };
    document.getElementById("editorZoomOut").onclick = () => {
      editorZoom = Math.max(0.25, editorZoom / 1.25);
      draw();
    };
    document.getElementById("editorZoomIn").onclick = () => {
      editorZoom = Math.min(8, editorZoom * 1.25);
      draw();
    };
    document.getElementById("editorFit").onclick = () => {
      editorZoom = 1;
      draw();
      stage.scrollLeft = 0;
      stage.scrollTop = 0;
    };
    stage.addEventListener("wheel", event => {
      event.preventDefault();
      const oldCanvasRect = canvas.getBoundingClientRect();
      const imageX = oldCanvasRect.width
        ? (event.clientX - oldCanvasRect.left) / oldCanvasRect.width
        : 0.5;
      const imageY = oldCanvasRect.height
        ? (event.clientY - oldCanvasRect.top) / oldCanvasRect.height
        : 0.5;
      editorZoom = event.deltaY < 0
        ? Math.min(8, editorZoom * 1.12)
        : Math.max(0.25, editorZoom / 1.12);
      draw();
      const newCanvasRect = canvas.getBoundingClientRect();
      const newPointerX = newCanvasRect.left + imageX * newCanvasRect.width;
      const newPointerY = newCanvasRect.top + imageY * newCanvasRect.height;
      stage.scrollLeft += newPointerX - event.clientX;
      stage.scrollTop += newPointerY - event.clientY;
    }, {passive: false});
    resetEditor.onclick = async () => {
      if (!confirm("Reset web editor positions, layer order, flips, and transparency overrides?")) return;
      await fetch("/api/reset", {method: "POST"});
      activeKey = null;
      await loadProject();
    };

    returnToApp.onclick = async () => {
      returnToApp.disabled = true;
      loadStatus.textContent = "Returning to desktop app...";
      try {
        await fetch("/api/return", {method: "POST"});
        loadStatus.textContent = "Returned to desktop app. This editor can remain open.";
      } finally {
        returnToApp.disabled = false;
      }
    };

    document.getElementById("refresh").onclick = loadProject;
    viewTexture.onclick = () => setViewMode("texture");
    viewRegion.onclick = () => setViewMode("region");
    window.addEventListener("resize", draw);
    setTool("select");
    loadProject();
  </script>
</body>
</html>
